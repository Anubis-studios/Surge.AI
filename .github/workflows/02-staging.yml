name: Staging Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (commit SHA or tag)'
        required: true
        type: string
      skip_integration_tests:
        description: 'Skip integration tests (emergency only)'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ["Development & Preview"]
    types: [completed]
    branches: [develop]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate: Verify Development Success
  verify-dev-success:
    name: Verify Development Pipeline
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi
          echo "✅ Version to deploy: ${{ steps.version.outputs.version }}"

  # Stage 1: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [verify-dev-success]
    if: ${{ !inputs.skip_integration_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-dev-success.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test database
        run: |
          docker-compose -f docker-compose.test.yml up -d postgres
          sleep 10

      - name: Run database migrations
        run: |
          npm run db:migrate:test
        env:
          DATABASE_URL: postgresql://surge:test@localhost:5432/surge_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://surge:test@localhost:5432/surge_test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}

      - name: Stop test database
        if: always()
        run: docker-compose -f docker-compose.test.yml down

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

  # Stage 2: Security Validation
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    needs: [verify-dev-success]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-dev-success.outputs.version }}

      - name: Run npm audit
        run: |
          npm audit --audit-level=high
          echo "✅ No high-severity vulnerabilities found"

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP ZAP baseline scan
        if: github.event_name == 'workflow_dispatch'
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'https://staging.surge-ai.com'
          fail_action: false

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Stage 3: Database Migration Validation
  db-migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: [verify-dev-success]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-dev-success.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate migration files
        run: |
          echo "🔍 Checking migration files..."
          ls -la scripts/supabase-migration.sql
          echo "✅ Migration files valid"

      - name: Dry-run migration
        run: |
          echo "🔍 Performing dry-run of database migrations..."
          # Validate SQL syntax
          cat scripts/supabase-migration.sql | head -50
          echo "✅ Migration dry-run complete"

  # Stage 4: Build Staging Image
  build-staging:
    name: Build Staging Docker Image
    runs-on: ubuntu-latest
    needs: [integration-tests, security-validation, db-migration-check]
    if: always() && !failure() && !cancelled()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-dev-success.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 5: Manual Approval Gate
  approval-gate:
    name: Approve Staging Deployment
    runs-on: ubuntu-latest
    needs: [build-staging]
    environment:
      name: staging-approval
      url: https://staging.surge-ai.com
    steps:
      - name: Approval notification
        run: |
          echo "✅ Staging deployment approved!"
          echo "Version: ${{ needs.verify-dev-success.outputs.version }}"
          echo "Deploying to: https://staging.surge-ai.com"

  # Stage 6: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: [approval-gate, verify-dev-success]
    environment:
      name: staging
      url: https://staging.surge-ai.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-dev-success.outputs.version }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          VERSION="${{ needs.verify-dev-success.outputs.version }}"
          echo "Deploying version: $VERSION"
          
          # Pull and deploy new image
          # Add your staging deployment commands here
          # Example:
          # ssh staging-server "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-$VERSION"
          # ssh staging-server "docker-compose -f docker-compose.staging.yml up -d"
          
          echo "✅ Staging deployment initiated"

      - name: Run database migrations on staging
        run: |
          echo "🗄️ Running database migrations on staging..."
          # Add migration commands here
          # Example:
          # ssh staging-server "npm run db:migrate"
          echo "✅ Database migrations complete"

      - name: Wait for deployment
        run: sleep 15

      - name: Health check
        run: |
          echo "🏥 Running health check on staging..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.surge-ai.com/health || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging health check passed!"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - Status: $STATUS"
            sleep 5
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Smoke tests
        run: |
          echo "🔥 Running smoke tests on staging..."
          # Add smoke test commands
          # curl -f https://staging.surge-ai.com/ || exit 1
          echo "✅ Smoke tests passed"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "URL: https://staging.surge-ai.com"
          echo "Version: ${{ needs.verify-dev-success.outputs.version }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          echo "Initiating automatic rollback..."
          # Add rollback commands
          # Example:
          # ssh staging-server "docker-compose -f docker-compose.staging.yml down"
          # ssh staging-server "docker-compose -f docker-compose.staging.yml up -d"
